{% if messages %}
  <div class="notice-stack" aria-live="polite">
    {% for message in messages %}
      <div class="notice {{ message.tags }}" {% if message.tags == "error" %}role="alert"{% else %}role="status"{% endif %}>
        <span>{{ message }}</span>
        <button class="notice-close" type="button" data-dismiss aria-label="Dismiss message">×</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
