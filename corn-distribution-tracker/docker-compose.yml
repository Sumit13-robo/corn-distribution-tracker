# Local development stack: PostgreSQL, Django/DRF API and nginx-served SPA.
# Production uses a managed database, S3-compatible private evidence storage and
# HTTPS termination - see docs/architecture/DEPLOYMENT_RUNBOOK.md and infra/.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: corn_tracker
      POSTGRES_USER: corn
      POSTGRES_PASSWORD: corn
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corn -d corn_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://corn:corn@db:5432/corn_tracker
      APP_ENV: development
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOCAL_STORAGE_DIR: /app/storage-data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - evidence-data:/app/storage-data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"

  web:
    build:
      context: ./apps/web
      args:
        # Vite variables are build-time and public; rebuild when they change.
        # /api/v1 + the nginx proxy keeps API calls same-origin (first-party session cookie).
        VITE_API_BASE_URL: /api/v1
        VITE_MAP_STYLE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  evidence-data:
