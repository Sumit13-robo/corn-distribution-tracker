[project]
name = "corn-tracker-api"
version = "0.1.0"
description = "Corn Distribution Tracker API (Django 5.2 + Django REST Framework + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "django-cors-headers>=4.9,<5",
    "gunicorn>=23.0,<24",
    "psycopg[binary]>=3.3,<4",
    "argon2-cffi>=25.1",
    "pillow>=13.0",
    "boto3>=1.43",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "ruff>=0.17",
    "mypy>=2.4",
    "django-stubs>=5.2.9,<5.3",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "E501"]
"apps/api/tests/*" = ["S105", "S106", "S107", "S108", "E501"]
# Migrations are generated by Django; formatting churn is not useful.
"apps/api/corn/migrations/*" = ["E501", "I001"]
"corn/migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings_test"

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed marker or bundled stubs; the S3 storage
# backend wraps them in narrow, typed functions of its own.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
